<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F7F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>香港美食地图与真口碑食单</title>
  <meta name="description" content="全港29家精选美食地图与攻略：涵盖5家平价米其林一星、8家全港知名名店（九记牛腩/澳牛/莲香楼等）与16家本地私藏老店，红磡住宿出发同样顺路。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23185A47'/%3E%3Cpath d='M32 14c-8.8 0-16 7.2-16 16 0 11.2 16 22 16 22s16-10.8 16-22c0-8.8-7.2-16-16-16zm0 21a5 5 0 1 1 0-10 5 5 0 0 1 0 10z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ================================================================
         VIEW 1: 地图总览（方案 B · 地图优先 + 底部抽屉）
         ================================================================ -->
    <section class="view-map-shell" id="view-overview" aria-label="香港美食地图总览">
      <!-- Quiet Desaturated Hong Kong Map -->
      <div id="hkMap" class="hk-map" role="application" aria-label="香港29家美食交互地图"></div>

      <!-- Top Floating Navigation & Single-Accent Filter Chips -->
      <header class="float-header">
        <div class="float-bar">
          <h1 class="float-title">香港美食地图</h1>
          <nav class="float-tabs" aria-label="页面切换">
            <button type="button" class="tab-link active" data-view="overview" aria-current="page">地图总览</button>
            <button type="button" class="tab-link" data-view="guide">路线攻略</button>
          </nav>
        </div>

        <div class="float-chips" id="filterRail" role="tablist" aria-label="按分类筛选">
          <button type="button" class="chip active" data-filter="all">全部 29</button>
          <button type="button" class="chip" data-filter="michelin-1">米其林一星 5</button>
          <button type="button" class="chip" data-filter="famous">知名名店 8</button>
          <button type="button" class="chip" data-filter="local-picks">本地私藏 16</button>
          <button type="button" class="chip" data-filter="seasonal">秋冬限定 5</button>
        </div>
      </header>

      <!-- Subtle Map Controls Floating Right -->
      <div class="map-tools" id="mapTools">
        <button type="button" class="map-tool-btn" id="btnRecenter" aria-label="回到红磡据点">红磡</button>
        <button type="button" class="map-tool-btn" id="btnFitAll" aria-label="全览所有标点">全览</button>
      </div>

      <div class="map-offline-bar" id="mapOfflineNotice" hidden>
        地图底图加载较慢，可直接浏览下方清单并跳转 Google / 高德导航
      </div>

      <!-- Bottom Spacious White Drawer -->
      <section class="drawer" id="drawer" aria-label="精选食单抽屉">
        <button type="button" class="drawer-handle-btn" id="drawerToggleBtn" aria-label="展开或收起食单抽屉">
          <span class="drawer-handle" aria-hidden="true"></span>
        </button>

        <!-- Mode A: Selected Map Pin Focus Card -->
        <div class="pin-focus" id="pinFocusPanel" hidden></div>

        <!-- Mode B: Calm Scannable List -->
        <div class="drawer-list-wrap" id="drawerListWrap">
          <div class="drawer-head">
            <div class="drawer-head-left">
              <h2 class="drawer-title">全港精选食单</h2>
              <span class="drawer-count" id="drawerMeta">共 29 家 · 红磡出发</span>
            </div>
            <div class="drawer-head-actions">
              <button type="button" class="text-btn" id="expandDrawerLink">展开</button>
            </div>
          </div>

          <p class="drawer-note" id="drawerNote">轻点地图圆点查看位置，或上滑浏览完整清单</p>

          <ul class="spot-list" id="spotList" aria-live="polite"></ul>

          <footer class="drawer-footer">
            <div class="footer-left">
              <span>v1.1.0</span>
              <span aria-hidden="true">·</span>
              <button type="button" class="text-btn" id="copyWechatBtn">复制微信食单</button>
            </div>
            <a href="https://github.com/holynova/hk-food-guide" target="_blank" rel="noopener noreferrer">GitHub</a>
          </footer>
        </div>
      </section>
    </section>

    <!-- ================================================================
         VIEW 2: 路线攻略（宽留白中文阅读视图）
         ================================================================ -->
    <section class="view-guide-shell" id="view-guide" aria-label="路线与避雷攻略" hidden>
      <header class="guide-topbar">
        <h2 class="float-title">香港美食地图</h2>
        <nav class="float-tabs" aria-label="页面切换">
          <button type="button" class="tab-link" data-view="overview">地图总览</button>
          <button type="button" class="tab-link active" data-view="guide" aria-current="page">路线攻略</button>
        </nav>
      </header>

      <div class="guide-content">
        <div class="guide-intro">
          <h2 class="guide-hero-title">红磡出发 · 觅食攻略</h2>
          <p class="guide-hero-sub" id="guideCountdown">全港 29 家核验食店，按工作日下班、过海摘星与周末进补拆解 5 条顺路路线。点店名直接看详情或定位。</p>
        </div>

        <section class="guide-section">
          <h3 class="guide-section-title">五条实战路线</h3>
          <div class="editorial-list" id="itineraryList"></div>
        </section>

        <section class="guide-section">
          <h3 class="guide-section-title">排队提醒与本地平替</h3>
          <div class="editorial-list" id="antiHypeList"></div>
        </section>

        <section class="guide-section">
          <h3 class="guide-section-title">行前实用常识</h3>
          <div class="editorial-list" id="tipsList"></div>
        </section>

        <footer class="drawer-footer guide-footer">
          <div class="footer-left">
            <span>香港美食地图 · v1.1.0</span>
            <span aria-hidden="true">·</span>
            <button type="button" class="text-btn" id="copyWechatGuideBtn">复制微信食单</button>
          </div>
          <a href="https://github.com/holynova/hk-food-guide" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
      </div>
    </section>
  </div>

  <!-- Slide-Up Restaurant Detail Sheet -->
  <div class="sheet-backdrop" id="detailBackdrop" hidden aria-hidden="true"></div>
  <aside class="detail-sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <div class="sheet-top">
      <span class="drawer-handle" aria-hidden="true"></span>
      <button type="button" class="sheet-close" id="detailCloseBtn" aria-label="关闭详情">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
